{% extends "base.html" %}

{% block title %}Configuration des Types de Colonnes{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Configuration des Types de Colonnes</h5>
                </div>
                <div class="card-body">
                    <div class="mb-4">
                        <label for="file-select" class="form-label">Sélectionner un fichier CSV normalisé :</label>
                        <select id="file-select" class="form-select">
                            <option value="">Choisir un fichier...</option>
                            {% for file in normalized_files %}
                            <option value="{{ file }}">{{ file }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div id="column-types-form" style="display: none;">
                        <h6>Configuration des Types</h6>
                        <div id="column-types-content"></div>
                        <button id="save-types" class="btn btn-primary mt-3">
                            <i class="fas fa-save me-2"></i>Enregistrer la configuration
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal pour les catégories -->
<div class="modal fade" id="categoriesModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Configuration des catégories</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Catégories (une par ligne)</label>
                    <textarea id="categories-input" class="form-control" rows="5"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annuler</button>
                <button type="button" class="btn btn-primary" id="save-categories">Enregistrer</button>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const fileSelect = document.getElementById('file-select');
    const columnTypesForm = document.getElementById('column-types-form');
    const columnTypesContent = document.getElementById('column-types-content');
    const saveTypesBtn = document.getElementById('save-types');
    const categoriesModal = new bootstrap.Modal(document.getElementById('categoriesModal'));
    const categoriesInput = document.getElementById('categories-input');
    const saveCategoriesBtn = document.getElementById('save-categories');

    let currentColumn = null;
    let columnConfigs = {};

    // Charger les colonnes lors de la sélection d'un fichier
    fileSelect.addEventListener('change', function() {
        const selectedFile = this.value;
        if (!selectedFile) {
            columnTypesForm.style.display = 'none';
            return;
        }

        fetch(`/get-column-types?file=${selectedFile}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    alert(data.error);
                    return;
                }

                columnConfigs = data.column_configs;
                displayColumnTypes(data.columns, data.column_configs);
                columnTypesForm.style.display = 'block';
            })
            .catch(error => {
                console.error('Erreur:', error);
                alert('Une erreur est survenue lors du chargement des colonnes');
            });
    });

    // Afficher le formulaire de configuration des types
    function displayColumnTypes(columns, configs) {
        let content = '<div class="table-responsive"><table class="table table-sm">';
        content += `
            <thead>
                <tr>
                    <th>Colonne</th>
                    <th>Type de données</th>
                    <th>Catégories</th>
                </tr>
            </thead>
            <tbody>
        `;

        columns.forEach(column => {
            const config = configs[column] || {};
            content += `
                <tr>
                    <td>${column}</td>
                    <td>
                        <select class="form-select form-select-sm data-type-select" data-column="${column}">
                            <option value="numeric" ${config.data_type === 'numeric' ? 'selected' : ''}>Numérique</option>
                            <option value="categorical_ordered" ${config.data_type === 'categorical_ordered' ? 'selected' : ''}>Catégoriel avec ordre</option>
                            <option value="categorical_unordered" ${config.data_type === 'categorical_unordered' ? 'selected' : ''}>Catégoriel sans ordre</option>
                            <option value="date" ${config.data_type === 'date' ? 'selected' : ''}>Date</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary configure-categories" 
                                data-column="${column}"
                                ${config.data_type && config.data_type.startsWith('categorical') ? '' : 'disabled'}>
                            <i class="fas fa-cog"></i>
                        </button>
                    </td>
                </tr>
            `;
        });

        content += '</tbody></table></div>';
        columnTypesContent.innerHTML = content;

        // Ajouter les gestionnaires d'événements
        document.querySelectorAll('.data-type-select').forEach(select => {
            select.addEventListener('change', function() {
                const column = this.dataset.column;
                const type = this.value;
                updateColumnConfig(column, 'data_type', type);
                
                // Mettre à jour l'état du bouton de configuration des catégories
                const categoriesBtn = document.querySelector(`.configure-categories[data-column="${column}"]`);
                categoriesBtn.disabled = !type.startsWith('categorical');
            });
        });

        document.querySelectorAll('.configure-categories').forEach(button => {
            button.addEventListener('click', function() {
                const column = this.dataset.column;
                currentColumn = column;
                const config = columnConfigs[column] || {};
                categoriesInput.value = config.categories ? config.categories.join('\n') : '';
                categoriesModal.show();
            });
        });
    }

    // Mettre à jour la configuration d'une colonne
    function updateColumnConfig(column, key, value) {
        if (!columnConfigs[column]) {
            columnConfigs[column] = {};
        }
        columnConfigs[column][key] = value;
    }

    // Sauvegarder les catégories
    saveCategoriesBtn.addEventListener('click', function() {
        if (currentColumn) {
            const categories = categoriesInput.value.split('\n').filter(cat => cat.trim());
            updateColumnConfig(currentColumn, 'categories', categories);
            categoriesModal.hide();
        }
    });

    // Sauvegarder la configuration
    saveTypesBtn.addEventListener('click', function() {
        const selectedFile = fileSelect.value;
        if (!selectedFile) {
            alert('Veuillez sélectionner un fichier');
            return;
        }

        fetch('/save-column-types', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                file: selectedFile,
                column_configs: columnConfigs
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                alert(data.error);
                return;
            }
            alert('Configuration enregistrée avec succès');
        })
        .catch(error => {
            console.error('Erreur:', error);
            alert('Une erreur est survenue lors de l\'enregistrement de la configuration');
        });
    });
});
</script>
{% endblock %}
